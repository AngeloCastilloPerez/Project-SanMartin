trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  PYTHON_VERSION: '3.10'

stages:

# ---------------------------------------------------------------------------
# Stage 1: Lint & test Python code
# ---------------------------------------------------------------------------
- stage: Lint_Test
  displayName: 'Lint & Test'
  jobs:
  - job: Python_Lint
    displayName: 'Python lint + unit tests'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest
      displayName: 'Install dependencies'

    - script: |
        flake8 functions/ fabric/notebooks/ --max-line-length=120 --ignore=E501,W503
      displayName: 'Flake8 lint'

    - script: |
        pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found, skipping."
      displayName: 'Run unit tests'

# ---------------------------------------------------------------------------
# Stage 2: Validate JSON / DAX configs
# ---------------------------------------------------------------------------
- stage: Validate_Configs
  displayName: 'Validate Configs'
  dependsOn: Lint_Test
  jobs:
  - job: JSON_Validate
    displayName: 'Validate JSON files'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        python -c "
        import json, glob, sys
        files = glob.glob('**/*.json', recursive=True)
        errors = []
        for f in files:
            try:
                json.load(open(f))
            except Exception as e:
                errors.append(f'{f}: {e}')
        if errors:
            print('JSON validation errors:')
            for e in errors: print(e)
            sys.exit(1)
        print(f'All {len(files)} JSON files are valid.')
        "
      displayName: 'Validate JSON syntax'

# ---------------------------------------------------------------------------
# Stage 3: Deploy to Fabric (dev) — manual approval for prod
# ---------------------------------------------------------------------------
- stage: Deploy_Dev
  displayName: 'Deploy → Dev'
  dependsOn: Validate_Configs
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: Deploy
    displayName: 'Deploy notebooks to Fabric dev workspace'
    steps:
    - script: |
        echo "Deploy to dev workspace via Fabric REST API"
        echo "Notebooks: fabric/notebooks/"
        echo "Lakehouses: fabric/lakehouses/"
      displayName: 'Deploy (placeholder — implement with Fabric REST API)'

- stage: Deploy_Prod
  displayName: 'Deploy → Prod'
  dependsOn: Validate_Configs
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy_Prod
    displayName: 'Deploy notebooks to Fabric prod workspace'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Deploy to prod workspace via Fabric REST API"
            displayName: 'Deploy (placeholder — implement with Fabric REST API)'
